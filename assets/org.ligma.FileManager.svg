<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.42" stop-color="#1d4ed8"/>
      <stop offset="0.78" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="body" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.34" stop-color="#3b82f6"/>
      <stop offset="0.72" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shutter" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="diskShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Rounded application tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tile)"/>
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none"
        stroke="#e0e7ff" stroke-opacity="0.30" stroke-width="4"/>
  <path d="M52 214 C 100 96, 262 52, 452 74 L452 36 Q452 24 440 24
           H132 Q36 24 36 120 L36 214 Z" fill="url(#gloss)"/>

  <!-- Floppy body -->
  <ellipse cx="256" cy="438" rx="158" ry="22" fill="#0f172a"
           opacity="0.30" filter="url(#diskShadow)"/>
  <path d="M152 82 H344 L426 164 V392 Q426 424 394 424 H118
           Q86 424 86 392 V114 Q86 82 118 82 Z"
        fill="url(#body)" stroke="#e0e7ff" stroke-opacity="0.62" stroke-width="6"/>
  <path d="M118 424 Q86 424 86 392 V372 H426 V392 Q426 424 394 424 Z"
        fill="#312e81" opacity="0.32"/>
  <path d="M152 82 H344 L426 164" fill="none" stroke="#f8fafc"
        stroke-opacity="0.55" stroke-width="6" stroke-linejoin="round"/>

  <!-- Shutter -->
  <rect x="238" y="82" width="104" height="132" rx="9" fill="url(#shutter)"/>
  <rect x="238.5" y="82.5" width="103" height="131" rx="8.5" fill="none"
        stroke="#64748b" stroke-opacity="0.42" stroke-width="2"/>
  <rect x="252" y="98" width="76" height="24" rx="5" fill="#312e81" opacity="0.72"/>
  <rect x="296" y="98" width="32" height="24" rx="5" fill="#1e1b4b" opacity="0.9"/>
  <rect x="252" y="138" width="76" height="9" rx="4.5" fill="#4338ca" opacity="0.38"/>
  <rect x="252" y="158" width="56" height="8" rx="4" fill="#4338ca" opacity="0.26"/>

  <!-- Label -->
  <rect x="126" y="246" width="260" height="160" rx="20" fill="url(#label)"/>
  <rect x="127.5" y="247.5" width="257" height="157" rx="18.5" fill="none"
        stroke="#a5b4fc" stroke-width="3" opacity="0.75"/>
  <rect x="150" y="274" width="180" height="15" rx="7.5" fill="url(#stripe)"/>
  <rect x="150" y="306" width="212" height="10" rx="5" fill="#93c5fd"/>
  <rect x="150" y="330" width="152" height="10" rx="5" fill="#c4b5fd"/>
  <rect x="330" y="350" width="32" height="12" rx="6" fill="url(#stripe)" opacity="0.85"/>
  <rect x="330" y="370" width="22" height="10" rx="5" fill="#a5b4fc"/>

  <!-- Diagonal glaze over the floppy -->
  <path d="M100 184 L206 82 H258 L112 228 Z" fill="#ffffff" opacity="0.13"/>
  <path d="M352 86 L398 132 L394 144 L346 96 Z" fill="#ffffff" opacity="0.12"/>
</svg>
